server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Catalog and stock come from the Java inventory service
    location /api/stores {
        proxy_pass http://inventory-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Orders go to the Python order service
    location /api/orders {
        proxy_pass http://order-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else under /api stays private, including the internal reservation API
    location /api/ {
        return 404;
    }

    # The Angular app; unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
