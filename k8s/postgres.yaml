apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: sizerun
type: Opaque
stringData:
  POSTGRES_USER: sizerun
  # Placeholder. Replace it, or create this Secret from a secret manager instead.
  POSTGRES_PASSWORD: change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: sizerun
data:
  01-create-databases.sql: |
    CREATE DATABASE inventory;
    CREATE DATABASE orders;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sizerun
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sizerun
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "localhost", "-U", "sizerun"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
