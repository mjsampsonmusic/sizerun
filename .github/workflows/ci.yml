name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  inventory-service:
    name: Inventory service (Java, Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sizerun
          POSTGRES_PASSWORD: sizerun
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sizerun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: inventory-service/pom.xml
      - name: Build and run the JUnit tests against PostgreSQL
        run: mvn -B verify

  order-service:
    name: Order service (Python, Flask)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sizerun
          POSTGRES_PASSWORD: sizerun
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sizerun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: order-service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the pytest suite against PostgreSQL
        run: pytest -v

  web:
    name: Web app (Angular, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run the Vitest suite
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build

  end-to-end:
    name: Full stack in Docker (smoke test)
    needs: [inventory-service, order-service, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start every service
        run: docker compose up -d --build
      - name: Order, retry, reject, and cancel through the web front door
        run: bash scripts/smoke-test.sh
        env:
          BASE_URL: http://localhost:4200
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  publish:
    name: Publish ${{ matrix.service }} image
    needs: end-to-end
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [inventory-service, order-service, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry names must be lowercase)
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${OWNER,,}/sizerun-${SERVICE}" >> "$GITHUB_OUTPUT"
      # Buildx pushes one plain image straight to the registry. The source label links the
      # package to this repository, which is what lets the workflow's token publish it.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
