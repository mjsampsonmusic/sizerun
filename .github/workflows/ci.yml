name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  inventory-service:
    name: Inventory service (Java, Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sizerun
          POSTGRES_PASSWORD: sizerun
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sizerun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: inventory-service/pom.xml
      - name: Build and run the JUnit tests against PostgreSQL
        run: mvn -B verify

  order-service:
    name: Order service (Python, Flask)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sizerun
          POSTGRES_PASSWORD: sizerun
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sizerun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: order-service/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run the pytest suite against PostgreSQL
        run: pytest -v

  web:
    name: Web app (Angular, TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run the Vitest suite
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build

  end-to-end:
    name: Full stack in Docker (smoke test)
    needs: [inventory-service, order-service, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start every service
        run: docker compose up -d --build
      - name: Order, retry, reject, and cancel through the web front door
        run: bash scripts/smoke-test.sh
        env:
          BASE_URL: http://localhost:4200
      - name: Show service logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images to GitHub Container Registry
    needs: end-to-end
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to ghcr.io
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the three images
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          for service in inventory-service order-service web; do
            image="ghcr.io/$owner/sizerun-$service"
            docker build \
              --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              -t "$image:$SHA" -t "$image:latest" "./$service"
            docker push --all-tags "$image"
          done
